$kind: http-request
url: "{{baseUrl}}/wagering/transactions"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{temporaryKey}}"
body:
  type: json
  content: |-
    {
      "providerId": "{{providerId}}",
      "externalTransactionId": "{{temporaryExternalId}}",
      "playerId": "{{playerId}}",
      "walletId": "{{walletId}}",
      "roundId": "postman-round",
      "gameId": "postman-demo",
      "kind": "ROLLBACK",
      "money": {
        "amount": "25.00",
        "currency": "BRL"
      },
      "referenceExternalTransactionId": "{{referenceExternalTransactionId}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const externalId = pm.variables.replaceIn("{{$guid}}");
      pm.environment.set("temporaryExternalId", externalId);
      pm.environment.set("temporaryKey", pm.environment.get("providerId") + ":" + externalId);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 422", function () { pm.response.to.have.status(422); });
      pm.test("Reversão duplicada", function () { pm.expect(pm.response.json().failureCode).to.eql("ALREADY_REVERSED"); });
      pm.test("Saldo preservado", function () { pm.expect(pm.response.json().balance.amount).to.eql("125.00"); });
    language: text/javascript
order: 3000
