$kind: http-request
url: "{{baseUrl}}/wallets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "playerId": "{{playerId}}",
      "initialBalance": {
        "amount": "100.00",
        "currency": "BRL"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 409", function () { pm.response.to.have.status(409); });
      pm.test("Conflito", function () { pm.expect(pm.response.json().error.code).to.eql("WALLET_ALREADY_EXISTS"); });
    language: text/javascript
order: 3000
