$kind: http-request
url: "{{baseUrl}}/wagering/transactions"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: json
  content: |-
    {
      "providerId": "{{providerId}}",
      "externalTransactionId": "{{externalTransactionId}}",
      "playerId": "{{playerId}}",
      "walletId": "{{walletId}}",
      "roundId": "postman-round",
      "gameId": "postman-demo",
      "kind": "BET",
      "money": {
        "amount": 25,
        "currency": "BRL"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", function () { pm.response.to.have.status(400); });
      pm.test("Dinheiro é string", function () { pm.expect(pm.response.json().error.code).to.eql("INVALID_REQUEST"); });
    language: text/javascript
order: 2000
