$kind: http-request
url: "{{baseUrl}}/wagering/transactions"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{temporaryKey}}"
body:
  type: json
  content: |-
    {
      "providerId": "{{providerId}}",
      "externalTransactionId": "{{externalTransactionId}}",
      "playerId": "{{playerId}}",
      "walletId": "{{walletId}}",
      "roundId": "postman-round",
      "gameId": "postman-demo",
      "kind": "BET",
      "money": {
        "amount": "25.00",
        "currency": "BRL"
      }
    }
scripts:
  - type: beforeRequest
    code: |-
      const externalId = pm.variables.replaceIn("{{$guid}}");
      pm.environment.set("temporaryExternalId", externalId);
      pm.environment.set("temporaryKey", pm.environment.get("providerId") + ":" + externalId);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 409", function () { pm.response.to.have.status(409); });
      pm.test("Conflito externo", function () { pm.expect(pm.response.json().error.code).to.eql("EXTERNAL_TRANSACTION_CONFLICT"); });
    language: text/javascript
order: 3000
