$kind: http-request
url: "{{baseUrl}}/health/ready"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("PostgreSQL acessível", function () { pm.expect(pm.response.json().checks.postgres).to.eql("up"); });
      pm.test("MiniStack acessível", function () { pm.expect(pm.response.json().checks.sqs).to.eql("up"); });
    language: text/javascript
order: 2000
