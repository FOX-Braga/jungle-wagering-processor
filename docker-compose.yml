name: jungle-wagering-phase1

x-app-environment: &app-environment
  NODE_ENV: production
  ALLOW_LOCAL_SERVICES: "true"
  PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_MAX_IN_FLIGHT: ${HTTP_MAX_IN_FLIGHT:-128}
  METRICS_PORT: ${METRICS_PORT:-0}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
  DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:-jungle_dev}@postgres:5432/${POSTGRES_DB:-jungle}}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-000000000000}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-dev}
  SQS_ENDPOINT: http://sqs:4566
  SQS_WAGER_QUEUE_URL: http://sqs:4566/${AWS_ACCESS_KEY_ID:-000000000000}/wager-transactions.fifo
  SQS_WAGER_DLQ_URL: http://sqs:4566/${AWS_ACCESS_KEY_ID:-000000000000}/wager-transactions-dlq.fifo
  SQS_EVENT_QUEUE_URL: http://sqs:4566/${AWS_ACCESS_KEY_ID:-000000000000}/${SQS_EVENT_QUEUE_NAME:-wager-events}
  SQS_POLL_WAIT_SECONDS: ${SQS_POLL_WAIT_SECONDS:-10}
  SQS_VISIBILITY_TIMEOUT_SECONDS: ${SQS_VISIBILITY_TIMEOUT_SECONDS:-30}
  SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
  SQS_CONSUMER_CONCURRENCY: ${SQS_CONSUMER_CONCURRENCY:-4}
  SQS_CONSUMER_BATCH_SIZE: ${SQS_CONSUMER_BATCH_SIZE:-1}
  SQS_CONSUMER_NAME: ${SQS_CONSUMER_NAME:-wager-processor}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-25}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
  OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
  REFERENCE_WORKER_BATCH_SIZE: ${REFERENCE_WORKER_BATCH_SIZE:-25}
  REFERENCE_WORKER_INTERVAL_MS: ${REFERENCE_WORKER_INTERVAL_MS:-1000}
  REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-10}

x-app: &app
  image: jungle-wagering-processor:0.1.0
  build: .
  environment: *app-environment
  networks: [backend]

x-worker: &worker
  <<: *app
  profiles: [workers]
  init: true
  stop_grace_period: 65s
  depends_on:
    setup:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle_dev}
      POSTGRES_DB: ${POSTGRES_DB:-jungle}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    image: ministackorg/ministack:1.5.38
    environment:
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_ACCOUNT_ID: ${AWS_ACCESS_KEY_ID:-000000000000}
      PERSIST_STATE: "1"
      STATE_DIR: /var/lib/ministack
    ports:
      - "127.0.0.1:${SQS_PORT:-4567}:4566"
    volumes:
      - sqs_data:/var/lib/ministack
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:4566/_ministack/health', timeout=2).close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  setup:
    <<: *app
    command: ["bun", "--no-env-file", "dist/scripts/bootstrap/infra.js", "provision"]
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy

  api:
    <<: *app
    init: true
    environment:
      <<: *app-environment
      METRICS_SHARED_INTERVAL_MS: ${METRICS_SHARED_INTERVAL_MS:-0}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/health/ready'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 4s
      retries: 15

  consumer:
    <<: *worker
    command: ["bun", "--no-env-file", "dist/src/worker.main.js", "consumer"]

  outbox:
    <<: *worker
    command: ["bun", "--no-env-file", "dist/src/worker.main.js", "outbox"]

  references:
    <<: *worker
    command: ["bun", "--no-env-file", "dist/src/worker.main.js", "references"]

networks:
  backend:

volumes:
  postgres_data:
  sqs_data:
