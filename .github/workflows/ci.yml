name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_load:
        description: Run the isolated benchmark after verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run infra:setup
      - run: bun run doctor
      - run: bun run test:all
      - if: github.event_name == 'workflow_dispatch' && inputs.run_load
        run: bun run test:load > load-results.json
      - if: github.event_name == 'workflow_dispatch' && inputs.run_load
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: load-results.json
      - if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - if: always()
        run: docker compose --env-file .env.example down --volumes
