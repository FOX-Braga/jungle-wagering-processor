name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run test:unit
      - run: bun run test:properties
      - run: bun run build
      - run: bun run infra:setup
      - run: bun run doctor
      - run: bun run test:integration
      - run: bun run test:e2e
      - run: bun run test:messaging
      - run: bun run test:recovery
      - run: bun run test:distributed
      - if: always()
        run: docker compose --env-file .env.example down --volumes
