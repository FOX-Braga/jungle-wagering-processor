name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_load:
        description: Run the isolated benchmark after verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHASE9_EVIDENCE_DIR: ${{ runner.temp }}/jungle-evidence
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: install
        run: bun install --frozen-lockfile
      - id: lint
        run: bun run lint
      - id: types
        run: bun run typecheck
      - id: format
        run: bun run format:check
      - id: regression
        run: bun run verify:evidence
      - if: github.event_name == 'workflow_dispatch' && inputs.run_load
        id: benchmark
        run: bun --no-env-file scripts/validation/phase9.ts load
      - name: Summarize verification
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BENCHMARK: ${{ steps.benchmark.outcome }}
        run: |
          mkdir -p "$PHASE9_EVIDENCE_DIR"
          report="$PHASE9_EVIDENCE_DIR/summary.md"
          {
            printf '## Verification of `%s`\n\n' "$GITHUB_SHA"
            printf '| Check | Outcome |\n| --- | --- |\n'
            printf '| Frozen install | %s |\n| Lint | %s |\n| Typecheck | %s |\n| Formatting | %s |\n| Regression | %s |\n| Benchmark | %s |\n' \
              "$INSTALL" "$LINT" "$TYPES" "$FORMAT" "$REGRESSION" "$BENCHMARK"
            if [ -f "$PHASE9_EVIDENCE_DIR/verify.json" ]; then
              bun --no-env-file -e '
                const { versions, tests, seconds, failure } = await Bun.file(process.argv[1]).json();
                console.log(`\n- Bun ${versions.bun}, Compose ${versions.compose ?? "unavailable"}, Docker ${versions.docker ?? "unavailable"}.`);
                console.log(`- Duration ${Math.round(seconds)} s.`);
                console.log(`- Failure stage ${failure ?? "none"}.`);
                if (tests) {
                  const { passed, failed, skipped, runnerErrors } = tests;
                  console.log(`- Tests ${passed} passed, ${failed} failed, ${skipped} skipped, ${runnerErrors} runner errors.`);
                } else {
                  console.log("- Tests have no results.");
                }
              ' "$PHASE9_EVIDENCE_DIR/verify.json"
            fi
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/jungle-evidence/
          if-no-files-found: error
